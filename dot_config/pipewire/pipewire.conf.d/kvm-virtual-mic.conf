# Micrófono virtual para el KVM: bin/kvm-media-loop.sh enlaza el audio de la
# REDRAGON Live Camera a kvm_virtual_mic_input (sink), que sale como fuente "KVM Mic".
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "KVM Virtual Mic"
            audio.position   = [ FL FR ]
            capture.props = {
                node.name   = "kvm_virtual_mic_input"
                media.class = "Audio/Sink"
                node.passive = true
            }
            playback.props = {
                node.name        = "kvm_virtual_mic"
                node.description = "KVM Mic"
                media.class      = "Audio/Source"
            }
        }
    }
]
