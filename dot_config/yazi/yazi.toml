[manager]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
show_hidden    = false
show_symlink   = true

[preview]
tab_size   = 2
max_width  = 600
max_height = 900

[opener]
edit = [
    { run = '$EDITOR "$@"', block = true, for = "unix" },
]
open = [
    { run = 'xdg-open "$@"', for = "linux" },
]

[open]
rules = [
    { mime = "text/*",        use = "edit" },
    { mime = "application/*", use = "open" },
    { mime = "image/*",       use = "open" },
    { mime = "video/*",       use = "open" },
    { mime = "audio/*",       use = "open" },
]
