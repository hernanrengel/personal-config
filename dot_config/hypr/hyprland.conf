# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# UPDATED FOR HYPRLAND 0.51.1
# #######################################################################################

################
### MONITORS ###
################
# monitor=,preferred,auto,1

monitor = HDMI-A-1,2560x1080@60,0x0,1
monitor = eDP-1,1920x1080@60,2560x0,1

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = dolphin
$menu = ags request toggle-launcher

# plugin = /usr/lib/libhyprexpo  # requiere instalar hyprland-plugins

#################
### AUTOSTART ###
#################
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && sleep 1 && systemctl --user restart xdg-desktop-portal xdg-desktop-portal-hyprland
exec-once = awww-daemon
exec-once = ags run
exec-once = ~/.config/hypr/scripts/monitor-manager.sh
# exec-once = swaync
# exec-once = fusuma -d (removed, dead)
exec-once = ~/.local/bin/random-wallpaper.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
# Apps Qt (Dolphin, etc.) siguen el tema GTK (Graphite-Dark oscuro) vía qgtk3
env = QT_QPA_PLATFORMTHEME,gtk3

###################
### PERMISSIONS ###
###################
# permission settings can be added here if needed

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 6
    gaps_out = 20
    border_size = 2
    # Fallback de primer arranque; lo sobreescribe ~/.cache/wal/colors-hyprland.conf (sourced al final)
    col.active_border = rgba(89b4faff) rgba(cba6f7ff) rgba(89dcebff) 45deg
    col.inactive_border = rgba(45475aaa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 14
    rounding_power = 2
    active_opacity = 0.95
    inactive_opacity = 0.82
    dim_inactive = true
    dim_strength = 0.15
    shadow {
        enabled = true
        range = 20
        render_power = 4
        color = rgba(0d0d1aee)
        color_inactive = rgba(0d0d1a77)
        offset = 0 4
    }
    # Blur aligerado: 3 passes/size 8 rinde ~igual que 4/14 con mucho menos GPU (mejor batería en la laptop)
    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.35
        vibrancy_darkness = 0.5
        noise = 0.02
        contrast = 0.9
        brightness = 0.85
        xray = false
        new_optimizations = true
    }
}

animations {
    enabled = yes, please :)
    # Smooth curves
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    # Bounce suave para ventanas
    bezier = bounce,0.05,0.9,0.1,1.05
    # Overshoot elegante para workspaces
    bezier = overshot,0.13,0.99,0.29,1.1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint

    # Ventanas — open con overshot (mismo "easing de llegada" que workspaces), close rápido
    animation = windows, 1, 4.5, easeOutQuint
    animation = windowsIn, 1, 5, overshot, popin 80%
    animation = windowsOut, 1, 1.2, quick, popin 80%

    # Fades
    animation = fadeIn, 1, 2.5, easeOutQuint
    animation = fadeOut, 1, 1.2, quick
    animation = fade, 1, 3.03, quick

    # Layers (waybar, wofi, swaync)
    animation = layers, 1, 3.5, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, quick, fade
    animation = fadeLayersIn, 1, 2, easeOutQuint
    animation = fadeLayersOut, 1, 1.2, quick

    # Workspaces — Opción 6: Rebote Fluido (Corregido)
    bezier = elastic_bounce, 0.175, 0.885, 0.32, 1.15
    animation = workspaces, 1, 6, elastic_bounce, slidefade 15%
    animation = workspacesIn, 1, 6, elastic_bounce, slidefade 15%
    animation = workspacesOut, 1, 6, elastic_bounce, slidefade 15%

    # Scratchpad / special workspace — zoom fade
    animation = specialWorkspace, 1, 4, easeOutQuint, slidefadevert 20%
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
    # Evita que Hyprland recargue TODA la config cuando cambia un archivo sourceado
    # (p.ej. ~/.cache/wal/colors-hyprland.conf, reescrito cada hora al cambiar el
    # fondo). Ese reload re-aplicaba las reglas de monitor/binds y reseteaba el
    # estado de runtime (monitor externo-solo, super-drag off, etc.). Los bordes
    # pywal se siguen aplicando en vivo vía `hyprctl keyword` desde random-wallpaper.sh.
    # Tras editar este archivo a mano, aplicar con: hyprctl reload
    disable_autoreload = true
    
    # Ahorro de energía y fluidez para juegos
    vrr = 1
}

render {
    # Optimización para apps y juegos en pantalla completa (direct scanout)
    direct_scanout = false
}

#############
### INPUT ###
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}



# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }

device {
    name = logitech-g502-1
    accel_profile = flat
    sensitivity = -0.25
}

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, T, exec, kitty --class kitty-float
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, R, exec, ags request toggle-launcher > /tmp/ags-bind-launcher.log 2>&1
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, A, exec, /home/brosso3d/.local/bin/refresh-bar.sh
# bind = ALT, Tab, cyclenext,
# bind = ALT, Tab, bringactivetotop,
# bind = ALT, TAB, workspace, +1
# bind = ALT SHIFT, TAB, workspace, -1
bind = ALT, left, workspace, -1
bind = ALT, right, workspace, +1

bind = SUPER, F12, exec, ~/.local/bin/kvm-fix.sh
bind = SUPER SHIFT, W, exec, ~/.local/bin/live-wallpaper.sh
bind = SUPER, W, exec, ~/.local/bin/random-wallpaper.sh --force
bind = SUPER, O, exec, ags request toggle-control-center
bind = SUPER, N, exec, ags request toggle-notif > /tmp/ags-bind-notif.log 2>&1
bind = SUPER SHIFT, E, exec, ags request toggle-power > /tmp/ags-bind-power.log 2>&1
bind = SUPER, B, exec, pkill ags || ags run
# HoN: si la ventana de juvio.exe se va diminuta (119x34), reescalar a 2560x1080 en vivo
bind = SUPER SHIFT, H, exec, hyprctl dispatch resizewindowpixel "exact 2560 1080,class:juvio.exe" && hyprctl dispatch movewindowpixel "exact 0 0,class:juvio.exe"

# bind = ALT, TAB, workspace, previous_workspace

bind = ALT, TAB, exec, hyprctl dispatch workspace previous

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic  # reemplazado por screenshot

# Screenshot (selección de área)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | tee ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png | wl-copy

# Grabar pantalla completa (video + audio)
bind = $mainMod ALT, R, exec, ~/.local/bin/screen-recorder.sh toggle
# Grabar un área específica (video + audio)
bind = $mainMod ALT SHIFT, R, exec, ~/.local/bin/screen-recorder.sh toggle-region
# Pausar/Reanudar grabación
bind = $mainMod ALT, P, exec, ~/.local/bin/screen-recorder.sh pause

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod, M, fullscreen, 1
bind = $mainMod, F, fullscreen, 0

# Move/resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ && ags request "osd-brightness"
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- && ags request "osd-brightness"

# Playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Lid switch bindings
bindl = , switch:on:Lid Switch, exec, /home/brosso3d/.config/hypr/scripts/toggle-internal-monitor.sh --disable
bindl = , switch:off:Lid Switch, exec, /home/brosso3d/.config/hypr/scripts/toggle-internal-monitor.sh --enable

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Google Chrome Picture-in-Picture (e.g., standard videos)

# Heroes of Newerth (Juvio) window rules to force fullscreen/floating layout
# Heroes of Newerth (Juvio)
windowrule = match:class ^([jJ][uU][vV][iI][oO](\.[eE][xX][eE])?|[hH][oO][nN](\.[eE][xX][eE])?)$, float 1
windowrule = match:class ^([jJ][uU][vV][iI][oO](\.[eE][xX][eE])?|[hH][oO][nN](\.[eE][xX][eE])?)$, fullscreen 1
windowrule = match:class ^([jJ][uU][vV][iI][oO](\.[eE][xX][eE])?|[hH][oO][nN](\.[eE][xX][eE])?)$, border_size 0

# Battle.net games
windowrule = match:class ^.*([hH]eroes|[sS]tar[cC]raft|[wW]arcraft|[wW]ow|[dD]iablo|[oO]verwatch|[hH]earthstone).*$, float 1
windowrule = match:class ^.*([hH]eroes|[sS]tar[cC]raft|[wW]arcraft|[wW]ow|[dD]iablo|[oO]verwatch|[hH]earthstone).*$, fullscreen 1
windowrule = match:class ^.*([hH]eroes|[sS]tar[cC]raft|[wW]arcraft|[wW]ow|[dD]iablo|[oO]verwatch|[hH]earthstone).*$, border_size 0

# Battle.net Launcher
windowrule = match:class ^([bB]attle\.net.*)$, float 1

# Google Chrome Picture-in-Picture
windowrule = match:title ^(Picture-in-Picture)$, float 1
windowrule = match:title ^(Picture-in-Picture)$, size 20% 20%
windowrule = match:title ^(Picture-in-Picture)$, move 79% 79%
windowrule = match:title ^(Picture-in-Picture)$, pin 1

# Layer rules for blur
layerrule = match:namespace ^(bar)$, blur 1
layerrule = match:namespace ^(bar)$, ignore_alpha 0.1
layerrule = match:namespace ^(dashboard)$, blur 1
layerrule = match:namespace ^(dashboard)$, ignore_alpha 0.1
layerrule = match:namespace ^(wofi)$, blur 1
layerrule = match:namespace ^(wofi)$, ignore_alpha 0.1

# Gestures (Mac-like workspace swipe)
gesture = 3, horizontal, workspace


# 3 Dedos Vertical (Aplicaciones y Sistema)
gesture = 3, up, dispatcher, exec, ags request toggle-launcher
gesture = 3, down, dispatcher, exec, ags request toggle-control-center

# 4 Dedos Vertical (Manejo de Ventanas)
gesture = 4, up, dispatcher, fullscreen, 1
gesture = 4, down, dispatcher, killactive
