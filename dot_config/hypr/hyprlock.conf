# hyprlock: pantalla de bloqueo (SUPER+L, o hypridle a los 15 min / al suspender)
general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot          # captura de la pantalla actual, desenfocada
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Hora
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgba(cdd6f4ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 160
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(cdd6f4cc)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(b4befeff)
    inner_color = rgba(11111bcc)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    fade_on_empty = false
    placeholder_text = <i>Contraseña</i>
    fail_text = <i>Incorrecta ($ATTEMPTS)</i>
    rounding = 14
    position = 0, -40
    halign = center
    valign = center
}
