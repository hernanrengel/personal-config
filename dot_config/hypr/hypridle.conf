# hypridle: protege el OLED de la G14 (burn-in) y ahorra batería
general {
    lock_cmd = pidof hyprlock || hyprlock          # evita abrir dos hyprlock
    before_sleep_cmd = loginctl lock-session        # bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on; brightnessctl -rd 'amdgpu_bl*'  # al despertar: pantalla y brillo
}

# 5 min: atenuar pantalla (guarda y restaura el brillo)
listener {
    timeout = 300
    on-timeout = brightnessctl -sd 'amdgpu_bl*' set 10%
    on-resume = brightnessctl -rd 'amdgpu_bl*'
}

# 5 min: apagar luz del teclado
listener {
    timeout = 300
    on-timeout = brightnessctl -sd asus::kbd_backlight set 0
    on-resume = brightnessctl -rd asus::kbd_backlight
}

# 10 min: apagar pantalla
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on; brightnessctl -rd 'amdgpu_bl*'
}

# 10 min: bloquear sesión (requisito BYOD: máx. 10 min)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
