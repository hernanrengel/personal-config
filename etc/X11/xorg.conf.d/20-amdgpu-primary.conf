# G14 (Radeon 890M + RTX 5070 Ti): la pantalla interna va por la Radeon.
# Sin esto Xorg (greeter de SDDM) toma la NVIDIA como principal y el login queda negro.
Section "OutputClass"
    Identifier "AMDgpu primary"
    MatchDriver "amdgpu"
    Driver "amdgpu"
    Option "PrimaryGPU" "yes"
EndSection

# Que el Xorg del login no tome la NVIDIA como GPU secundaria: SDDM lo deja
# corriendo durante toda la sesión y eso impedía que la dGPU se durmiera.
Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection
